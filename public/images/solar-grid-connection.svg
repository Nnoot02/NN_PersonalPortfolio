<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="solarTitle solarDesc">
  <title id="solarTitle">1 MW solar grid-connection assessment - single-line concept</title>
  <desc id="solarDesc">Single-line concept of a 1 MW solar plant connecting to the SA Power Networks distribution grid. Two options leave the grid bus and meet at the point of common coupling: a 400 V low-voltage connection under TS132 carrying about 1443 A through heavy switchgear, and an 11 / 33 kV high-voltage connection through a step-up transformer under TS133. The point of common coupling carries protection, metering and SCADA under TS134. A 1.0 MW AC, 400 V inverter to AS/NZS 4777.2 connects to the point of common coupling and is fed by a 1.2 MWp DC PV array. An optional battery energy storage system to AS/NZS 5139 and NICC271 is shown dashed.</desc>

  <!-- Vector redraw of the published figure. Palette is inlined from :root in
       app/globals.css: an SVG loaded through <img> cannot inherit custom properties. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e4dfd4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="#f3f0e9"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <rect x="64" y="60" width="88" height="8" fill="#c84b1a"/>

  <g font-family="'Inter',Arial,Helvetica,sans-serif" fill="#242321">

    <!-- Distribution grid bus -->
    <text x="520" y="132" font-size="27" font-weight="700">SA POWER NETWORKS DISTRIBUTION GRID</text>
    <line x1="520" y1="160" x2="1000" y2="160" stroke="#242321" stroke-width="6"/>

    <!-- LV branch: 400 V, TS132 -->
    <line x1="620" y1="160" x2="620" y2="620" stroke="#242321" stroke-width="4"/>
    <rect x="609" y="376" width="22" height="48" fill="#f3f0e9" stroke="#242321" stroke-width="4"/>
    <text x="636" y="372" font-size="21" font-weight="700">LV · TS132</text>
    <text x="636" y="398" font-size="19" fill="#6d6962">400 V</text>
    <text x="636" y="424" font-size="18" fill="#9f3510" font-family="Consolas,'Courier New',monospace">~1443 A</text>
    <text x="636" y="448" font-size="19" fill="#6d6962">heavy switchgear</text>

    <!-- HV branch: step-up transformer, TS133 -->
    <line x1="900" y1="160" x2="900" y2="328" stroke="#242321" stroke-width="4"/>
    <line x1="900" y1="430" x2="900" y2="620" stroke="#242321" stroke-width="4"/>
    <circle cx="900" cy="360" r="32" fill="none" stroke="#242321" stroke-width="4"/>
    <circle cx="900" cy="398" r="32" fill="none" stroke="#242321" stroke-width="4"/>
    <text x="948" y="352" font-size="21" font-weight="700">STEP-UP TX</text>
    <text x="948" y="378" font-size="19" fill="#6d6962">HV · TS133</text>
    <text x="948" y="406" font-size="21" fill="#9f3510" font-family="Consolas,'Courier New',monospace">11 / 33 kV</text>

    <!-- Site-specific network study note -->
    <g font-size="24" fill="#6d6962">
      <text x="96" y="372">Connection voltage is set by</text>
      <text x="96" y="404">a site-specific SA Power</text>
      <text x="96" y="436">Networks network study:</text>
      <text x="96" y="468">feeder thermal limit, voltage</text>
      <text x="96" y="500">rise, fault level, protection</text>
      <text x="96" y="532">grading, not the 1 MW figure.</text>
    </g>

    <!-- Point of common coupling -->
    <line x1="620" y1="620" x2="1180" y2="620" stroke="#242321" stroke-width="6"/>
    <text x="561" y="606" font-size="21" font-weight="700" text-anchor="end">POINT OF COMMON COUPLING</text>
    <g font-size="19" fill="#6d6962" text-anchor="end">
      <text x="561" y="632">protection · metering</text>
      <text x="561" y="656">SCADA · TS134</text>
    </g>

    <!-- Inverter -->
    <line x1="760" y1="620" x2="760" y2="734" stroke="#242321" stroke-width="4"/>
    <rect x="655" y="734" width="210" height="92" fill="#f3f0e9" stroke="#242321" stroke-width="4"/>
    <line x1="663" y1="818" x2="857" y2="742" stroke="#242321" stroke-width="2.5"/>
    <g stroke="#242321" stroke-width="2">
      <line x1="690" y1="758" x2="726" y2="758"/>
      <line x1="696" y1="767" x2="720" y2="767"/>
    </g>
    <path d="M793 806 q9 -14 17 0 t17 0" fill="none" stroke="#242321" stroke-width="2"/>
    <text x="884" y="762" font-size="26" font-weight="700">INVERTER</text>
    <text x="884" y="792" font-size="23" fill="#9f3510" font-family="Consolas,'Courier New',monospace">1.0 MW AC · 400 V</text>
    <text x="884" y="820" font-size="21" fill="#6d6962">AS/NZS 4777.2</text>

    <!-- PV array -->
    <line x1="760" y1="826" x2="760" y2="888" stroke="#242321" stroke-width="4"/>
    <rect x="655" y="888" width="210" height="84" fill="#f3f0e9" stroke="#242321" stroke-width="4"/>
    <g stroke="#242321" stroke-width="2">
      <line x1="707" y1="888" x2="707" y2="972"/>
      <line x1="760" y1="888" x2="760" y2="972"/>
      <line x1="813" y1="888" x2="813" y2="972"/>
      <line x1="655" y1="930" x2="865" y2="930"/>
    </g>
    <text x="884" y="918" font-size="26" font-weight="700">PV ARRAY</text>
    <text x="884" y="948" font-size="21" fill="#9f3510" font-family="Consolas,'Courier New',monospace">≈1.2 MWp DC</text>

    <!-- BESS (optional) -->
    <line x1="1180" y1="620" x2="1180" y2="862" stroke="#242321" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="1085" y="862" width="190" height="86" fill="#f3f0e9" stroke="#242321" stroke-width="3" stroke-dasharray="4 4"/>
    <text x="1180" y="902" font-size="24" font-weight="700" text-anchor="middle">BESS</text>
    <text x="1180" y="930" font-size="18" fill="#6d6962" text-anchor="middle">(optional)</text>
    <text x="1180" y="974" font-size="19" fill="#6d6962" text-anchor="middle">AS/NZS 5139 · NICC271</text>

    <!-- Title block -->
    <rect x="64" y="894" width="560" height="112" fill="none" stroke="#242321" stroke-width="3"/>
    <text x="88" y="932" font-size="17" font-weight="700" letter-spacing="0.3">1 MW SOLAR GRID-CONNECTION ASSESSMENT</text>
    <g font-size="17" fill="#6d6962">
      <text x="88" y="966">Single-line concept · AS/NZS 4777.2 · SAPN TS132 / TS133</text>
      <text x="88" y="992">Not to scale</text>
    </g>
  </g>
</svg>
