name: verify

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow checks code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch makes the older run moot.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The main ruleset requires a check named exactly "verify" from GitHub
  # Actions. Renaming this job, or giving it a name: key, leaves every PR
  # stuck on "Expected"; update the ruleset in the same change.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://nnoott.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to new
      # code, a commit cannot. Dependabot bumps the pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm verify
